services:
  - type: web
    name: eppms-app
    runtime: docker
    plan: free
    region: frankfurt # or oregon, ohio, singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "NCAA EPPMS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "true"
      - key: APP_KEY
        value: "base64:gMRqqhW02cLJKiLvsHHKc4W+BzXtje3ckmX4yOLo2Hg="
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
